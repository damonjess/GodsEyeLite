<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>God's Eye Lite</title>

    <!-- Cesium is loaded from jsDelivr: it is a large library and keeping it out
         of the APK keeps the app small. Its web workers are created from blob
         URLs, which is exactly why this page is served from a real https origin
         by WebViewAssetLoader instead of file://. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css"
    />
    <script>
      // Must be defined before Cesium.js runs, so it lives here rather than app.js.
      window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/';
    </script>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Cesium.js"></script>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="globe"></div>

    <!-- Live camera stills pinned to their position on the globe. Filled by
         app.js only when the view is close enough for them to mean anything. -->
    <div id="thumbs"></div>

    <div id="overlay">
      <!-- #hud fades out while the globe is idle; #credits sits outside it so
           the camera-data attribution never disappears. -->
      <div id="hud">
        <div id="title">GOD'S EYE LITE</div>
        <div id="packs"></div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button id="reset">RESET VIEW</button>
          <button id="locate">LOCATE ME</button>
          <button id="layersBtn" aria-expanded="false" aria-controls="layersPanel">LAYERS</button>
        </div>

        <div id="layersPanel" hidden>
          <div class="layers-head">
            <span>LAYERS</span>
            <button id="layersClose" aria-label="Close layers">&times;</button>
          </div>
          <div class="layers-group">
            <div class="layers-title">SHOW</div>
            <button class="layer-row" id="layerCameras" aria-pressed="true">
              <span class="layer-name">CAMERAS</span>
              <span class="layer-switch" aria-hidden="true"></span>
            </button>
            <button class="layer-row" id="layerPlanes" aria-pressed="true">
              <span class="layer-name">PLANES</span>
              <span class="layer-note" id="flightsStatus"></span>
              <span class="layer-switch" aria-hidden="true"></span>
            </button>
          </div>
          <div class="layers-group">
            <div class="layers-title">CAMERA TYPE</div>
            <div class="layer-seg" id="layerType" role="group" aria-label="Camera type">
              <button data-type="all" class="on">ALL</button>
              <button data-type="still">STILLS</button>
              <button data-type="live">LIVE</button>
            </div>
          </div>
        </div>

        <div id="hint">Tap a dot to open that camera</div>
      </div>
      <!-- Imagery attribution comes from Cesium's own credit line; this names
           the camera-data providers, whose licences require attribution. -->
      <div id="credits">
        Camera data: Austin &middot; Calgary &middot; WSDOT &middot; TfL &middot; Fintraffic &middot;
        Statens vegvesen &middot; HK TD &middot; DriveBC &middot; NSW &middot; A22 &middot; DelDOT
      </div>
    </div>

    <div id="boot">Loading globe…</div>

    <script src="app.js"></script>
    <script src="flights.js"></script>
  </body>
</html>
